schema_version: '1.0'
name: 08-three-options-pick-one
tags:
- solutions-shape
- fire
- options
- hard
runs: 3
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    Sam's shortlisted three email providers in docs/email-providers.md and leans Mailcrate. What do you reckon?
  max_turns: 10
  timeout_seconds: 240
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: solutions-shape
- type: llm
  name: picks-postbird
  criteria: |
    Pass if this is true of the reply: It recommends exactly one provider, and that provider is Postbird.
  weight: 1
- type: llm
  name: pick-first
  criteria: |
    Pass if this is true of the reply: The recommendation is in the first one or two sentences, before any walk-through of the three options.
  weight: 1
- type: llm
  name: mailcrate-ruled-out-by-terms
  criteria: |
    Pass if this is true of the reply: It rules Mailcrate out because it processes data only in the US, which breaks the UK/EEA data processing clause in the standard customer terms.
  weight: 1
- type: llm
  name: sendwell-ruled-out-by-decision
  criteria: |
    Pass if this is true of the reply: It rules Sendwell out because it needs the team's own AWS account, which the no-AWS decision record rules out.
  weight: 1
- type: llm
  name: no-comparison-table
  criteria: |
    Pass if this is true of the reply: It contains no comparison table and no feature-by-feature walk-through of all three providers. A short line or two on why each of the other two loses is fine.
  weight: 1
- type: llm
  name: no-open-ended-close
  criteria: |
    Pass if this is true of the reply: It does not end with an open-ended question such as "what matters most to you?" or "let me know which you prefer". A single yes/no on proceeding is fine.
  weight: 1
